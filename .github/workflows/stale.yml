name: Stale
on:
  schedule:
    - cron: "0 0 * * 0"
jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has been marked as stale due to inactivity."
          days-before-stale: 60
          days-before-close: 7
