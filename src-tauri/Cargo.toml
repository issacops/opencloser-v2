[package]
name = "app"
version = "0.2.0"
description = "OpenCloser — local-first AI sales team for your desktop"
authors = ["OpenCloser"]
license = "MIT"
repository = "https://github.com/opencloser/opencloser"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31.0", features = ["bundled"] }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
dotenvy = "0.15.7"
tauri-plugin-shell = "2.3.5"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
